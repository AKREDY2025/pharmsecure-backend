<!DOCTYPE html>
<html lang="en">
<head>
    <script>
    (function() {
        const token = localStorage.getItem("token");
        if (!token) {
            window.location.href = "/login.html";
        }
    })();
    
        // ==================== BILINGUAL SUPPORT ====================
        const translations = {
            en: {
                title: "PharmSecure",
                language: "English",
                dashboard: "Dashboard",
                sales: "Sales",
                inventory: "Inventory",
                reports: "Reports",
                refunds: "Refunds",
                staff: "Staff",
                settings: "Settings",
                printing: "Printing",
                logout: "Logout",
                search: "Search...",
                save: "Save",
                cancel: "Cancel",
                delete: "Delete",
                add: "Add",
                edit: "Edit",
                close: "Close",
                loading: "Loading...",
                noData: "No data available",
                error: "Error",
                success: "Success"
            },
            fr: {
                title: "PharmSecure",
                language: "Français",
                dashboard: "Tableau de Bord",
                sales: "Ventes",
                inventory: "Inventaire",
                reports: "Rapports",
                refunds: "Remboursements",
                staff: "Personnel",
                settings: "Paramètres",
                printing: "Impression",
                logout: "Déconnexion",
                search: "Rechercher...",
                save: "Enregistrer",
                cancel: "Annuler",
                delete: "Supprimer",
                add: "Ajouter",
                edit: "Modifier",
                close: "Fermer",
                loading: "Chargement...",
                noData: "Aucune donnée disponible",
                error: "Erreur",
                success: "Succès"
            }
        };

        let currentLanguage = localStorage.getItem('language') || 'en';

        function setLanguage(lang) {
            currentLanguage = lang;
            localStorage.setItem('language', lang);
            updateUIText();
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
        }

        function updateUIText() {
            const t = translations[currentLanguage];
            // Update all elements with data-i18n attribute
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                if (t[key]) {
                    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                        el.placeholder = t[key];
                    } else {
                        el.textContent = t[key];
                    }
                }
            });
        }

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', () => {
            updateUIText();
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === currentLanguage);
            });
        });

    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Printing - PharmSecure</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #333;
            font-size: 24px;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .nav-button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
        }

        .nav-button:hover {
            background: #764ba2;
        }

        .nav-button.danger {
            background: #e74c3c;
        }

        .nav-button.danger:hover {
            background: #c0392b;
        }

        .search-section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .search-input {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-input input {
            flex: 1;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .search-input button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .search-input button:hover {
            background: #764ba2;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .stat-card h3 {
            color: #667eea;
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .stat-card .number {
            color: #333;
            font-size: 32px;
            font-weight: bold;
        }

        .receipt-section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .receipt-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .receipt-preview {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-y: auto;
            max-height: 400px;
            border: 1px solid #ddd;
        }

        .qr-code-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .qr-code {
            width: 200px;
            height: 200px;
            border: 2px solid #ddd;
            border-radius: 5px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-code img {
            max-width: 100%;
            max-height: 100%;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .action-button {
            background: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .action-button:hover {
            background: #229954;
        }

        .action-button.secondary {
            background: #3498db;
        }

        .action-button.secondary:hover {
            background: #2980b9;
        }

        .recent-receipts {
            margin-top: 30px;
        }

        .recent-receipts h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        table thead {
            background: #667eea;
            color: white;
        }

        table th, table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        table tbody tr:hover {
            background: #f5f5f5;
        }

        table tbody tr td:first-child {
            cursor: pointer;
            color: #667eea;
            text-decoration: underline;
        }

        .loading {
            color: #667eea;
            font-style: italic;
        }

        .error {
            color: #e74c3c;
            padding: 15px;
            background: #fadbd8;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .success {
            color: #27ae60;
            padding: 15px;
            background: #d5f4e6;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .message-box {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 5px;
            background: #27ae60;
            color: white;
            max-width: 300px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .message-box.error {
            background: #e74c3c;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @media print {
            body {
                background: white;
            }
            .header, .search-section, .stats-grid, .action-buttons, .recent-receipts, .nav-button {
                display: none;
            }
            .receipt-section {
                box-shadow: none;
                page-break-after: always;
            }
        }
    
        .language-toggle {
            display: flex;
            gap: 8px;
        }
        .lang-btn {
            padding: 8px 14px;
            border: 1px solid #bdc3c7;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .lang-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        .lang-btn:hover {
            border-color: #667eea;
        }

    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="language-toggle">
                                <button class="lang-btn active" onclick="setLanguage('en')" data-lang="en">EN</button>
                                <button class="lang-btn" onclick="setLanguage('fr')" data-lang="fr">FR</button>
                            </div>
            <h1>📄 Printing & Receipts</h1>
            <div class="header-buttons">
                <button class="nav-button" onclick="window.location.href='dashboard.html'">Dashboard</button>
                <button class="nav-button" onclick="window.location.href='refunds.html'">Refunds</button>
                <button class="nav-button danger" onclick="logout()">Logout</button>
            </div>
        </div>

        <!-- Search Section -->
        <div class="search-section">
            <h2 style="margin-bottom: 15px; color: #333;">Search Receipt</h2>
            <div class="search-input">
                <input type="number" id="orderIdInput" placeholder="Enter Order ID" min="1">
                <button onclick="searchReceipt()">🔍 Search</button>
                <button class="nav-button" onclick="loadRecentReceipts()" style="background: #95a5a6;">Refresh</button>
            </div>
        </div>

        <!-- Statistics -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Receipts</h3>
                <div class="number" id="totalReceipts">-</div>
            </div>
            <div class="stat-card">
                <h3>Today's Receipts</h3>
                <div class="number" id="todayReceipts">-</div>
            </div>
            <div class="stat-card">
                <h3>This Week</h3>
                <div class="number" id="weekReceipts">-</div>
            </div>
        </div>

        <!-- Receipt Display -->
        <div class="receipt-section" id="receiptSection" style="display: none;">
            <div class="receipt-container">
                <div class="receipt-preview" id="receiptPreview">Loading...</div>
                <div class="qr-code-section">
                    <div class="qr-code" id="qrCode">
                        <span class="loading">Generating QR Code...</span>
                    </div>
                    <div class="action-buttons">
                        <button class="action-button" onclick="downloadPDF()">📥 Download PDF</button>
                        <button class="action-button secondary" onclick="window.print()">🖨️ Print</button>
                        <button class="action-button" onclick="showEmailDialog()">📧 Email Receipt</button>
                        <button class="action-button" onclick="showSMSDialog()">📱 SMS Receipt</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Barcode Labels Section -->
        <div class="receipt-section">
            <h2 style="margin: 0; margin-bottom: 15px;">🏷️ Print Barcode Labels</h2>
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <select id="productSelect" style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
                    <option value="">-- Select Product --</option>
                </select>
                <input type="number" id="labelQty" placeholder="Quantity (1-100)" min="1" max="100" value="5" style="width: 150px; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
                <button class="action-button" onclick="generateBarcodeLabels()" style="padding: 10px 20px;">📥 Generate Labels</button>
            </div>
        </div>

        <!-- Recent Receipts Table -->
        <div class="receipt-section">
            <h2 class="recent-receipts" style="margin: 0; margin-bottom: 15px;">📋 Recent Receipts</h2>
            <table>
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Date</th>
                        <th>Customer</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="recentTable">
                    <tr>
                        <td colspan="6" class="loading">Loading receipts...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api/printing';
        let currentOrderId = null;

        // Get token from localStorage
        function getToken() {
            return localStorage.getItem('token');
        }

        // Show message
        function showMessage(message, type = 'success') {
            const box = document.createElement('div');
            box.className = `message-box ${type}`;
            box.textContent = message;
            document.body.appendChild(box);
            setTimeout(() => box.remove(), 3000);
        }

        // Search receipt
        async function searchReceipt() {
            const orderId = document.getElementById('orderIdInput').value;
            if (!orderId) {
                showMessage('Please enter an Order ID', 'error');
                return;
            }

            currentOrderId = orderId;
            try {
                const response = await fetch(`${API_URL}/receipt/${orderId}`, {
                    headers: {
                        'Authorization': `Bearer ${getToken()}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Receipt not found');
                }

                const receipt = await response.json();
                displayReceipt(receipt);
                generateQRCode(orderId);
                loadRecentReceipts();
                loadProducts();
            } catch (error) {
                showMessage(`Error: ${error.message}`, 'error');
                document.getElementById('receiptSection').style.display = 'none';
            }
        }

        // Display receipt
        function displayReceipt(receipt) {
            const formatDate = (date) => {
                return new Date(date).toLocaleString();
            };

            const receiptText = `
PHARMSECURE - RECEIPT
════════════════════════════════
Order ID: ${receipt.order_id}
Date: ${formatDate(receipt.created_at)}
Customer: ${receipt.customer_name || 'Walk-in Customer'}
Phone: ${receipt.customer_phone || 'N/A'}

────────────────────────────────
ITEMS:
────────────────────────────────
${receipt.items.map(item => 
    `${item.product_name.padEnd(20)} ${item.quantity}x GHS ${parseFloat(item.unit_price).toFixed(2)} = GHS ${(item.quantity * item.unit_price).toFixed(2)}`
).join('\n')}

────────────────────────────────
SUBTOTAL:                GHS ${parseFloat(receipt.subtotal).toFixed(2)}
TAX (15%):               GHS ${parseFloat(receipt.tax).toFixed(2)}
════════════════════════════════
TOTAL:                   GHS ${parseFloat(receipt.total_amount).toFixed(2)}
════════════════════════════════

Payment Method: ${receipt.payment_method || 'Not specified'}
Status: ${receipt.status}

Thank you for your business!
PharmSecure - Quality Healthcare
            `;

            document.getElementById('receiptPreview').textContent = receiptText;
            document.getElementById('receiptSection').style.display = 'block';
        }

        // Generate QR code
        async function generateQRCode(orderId) {
            try {
                const response = await fetch(`${API_URL}/qr/${orderId}`, {
                    headers: {
                        'Authorization': `Bearer ${getToken()}`
                    }
                });

                if (!response.ok) {
                    throw new Error('QR code generation failed');
                }

                const data = await response.json();
                const qrContainer = document.getElementById('qrCode');
                qrContainer.innerHTML = `<img src="${data.qr_code}" alt="QR Code">`;
            } catch (error) {
                document.getElementById('qrCode').innerHTML = `<span class="error">QR Code Error</span>`;
            }
        }

        // Download PDF
        async function downloadPDF() {
            if (!currentOrderId) {
                showMessage('No receipt selected', 'error');
                return;
            }

            try {
                window.open(`${API_URL}/pdf/${currentOrderId}?token=${getToken()}`, '_blank');
                showMessage('PDF downloading...', 'success');
            } catch (error) {
                showMessage(`PDF Error: ${error.message}`, 'error');
            }
        }
        async function showEmailDialog() {
            if (!currentOrderId) {
                showMessage("No receipt selected", "error");
                return;
            }
            const email = prompt("Enter email address:", "");
            if (!email) return;
            
            try {
                const response = await fetch(`${API_URL}/email/${currentOrderId}`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${getToken()}`
                    },
                    body: JSON.stringify({ email, subject: `Receipt #${currentOrderId}`, message: "Your receipt is attached." })
                });
                const data = await response.json();
                if (response.ok) {
                    showMessage(`Email sent to ${email}`, "success");
                } else {
                    showMessage(data.error || "Failed to send email", "error");
                }
            } catch (error) {
                showMessage(`Email Error: ${error.message}`, "error");
            }
        }
        
        async function showSMSDialog() {
            if (!currentOrderId) {
                showMessage("No receipt selected", "error");
                return;
            }
            const phone = prompt("Enter phone number (+1234567890):", "");
            if (!phone) return;
            
            try {
                const response = await fetch(`${API_URL}/sms/${currentOrderId}`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${getToken()}`
                    },
                    body: JSON.stringify({ phone_number: phone, message_type: "summary" })
                });
                const data = await response.json();
                if (response.ok) {
                    showMessage(`SMS sent to ${phone}`, "success");
                } else {
                    showMessage(data.error || "Failed to send SMS", "error");
                }
            } catch (error) {
                showMessage(`SMS Error: ${error.message}`, "error");
            }
        }


        // Load recent receipts
        async function loadProducts() {
            try {
                const response = await fetch(`http://localhost:3000/api/products`, {
                    headers: { "Authorization": `Bearer ${getToken()}` }
                });
                if (!response.ok) throw new Error("Failed to load products");
                let data = await response.json();
                let products = data.data?.products || data.products || data.rows || data;
                const select = document.getElementById("productSelect");
                if (Array.isArray(products)) {
                    products.forEach(p => {
                        const option = document.createElement("option");
                        option.value = p.id;
                        option.textContent = `${p.name} (GHS ${parseFloat(p.unit_price).toFixed(2)})`;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                showMessage(`Error loading products: ${error.message}`, "error");
            }
        }
        
        async function generateBarcodeLabels() {
            const productId = document.getElementById("productSelect").value;
            const quantity = document.getElementById("labelQty").value;
            
            if (!productId) {
                showMessage("Please select a product", "error");
                return;
            }
            
            if (!quantity || quantity < 1 || quantity > 100) {
                showMessage("Quantity must be between 1 and 100", "error");
                return;
            }
            
            try {
                const url = `${API_URL}/barcode/${productId}?qty=${quantity}&token=${getToken()}`;
                window.open(url, "_blank");
                showMessage(`Generating ${quantity} barcode labels...`, "success");
            } catch (error) {
                showMessage(`Barcode Error: ${error.message}`, "error");
            }
        }

        async function loadRecentReceipts() {
            try {
                const response = await fetch(`${API_URL}/receipts`, {
                    headers: {
                        'Authorization': `Bearer ${getToken()}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to load receipts');
                }

                const receipts = await response.json();
                const tbody = document.getElementById('recentTable');
                
                if (receipts.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="loading">No receipts found</td></tr>';
                    return;
                }

                tbody.innerHTML = receipts.map(receipt => `
                    <tr onclick="searchAndDisplay(${receipt.order_id})">
                        <td>${receipt.order_id}</td>
                        <td>${new Date(receipt.created_at).toLocaleDateString()}</td>
                        <td>${receipt.customer_name || 'Walk-in'}</td>
                        <td>GHS ${parseFloat(receipt.total_amount).toFixed(2)}</td>
                        <td><span style="background: ${receipt.status === 'completed' ? '#d5f4e6' : '#ffeaa7'}; padding: 5px 10px; border-radius: 3px;">${receipt.status}</span></td>
                        <td><button class="action-button" style="padding: 5px 10px; font-size: 12px;">View</button></td>
                    </tr>
                `).join('');

                // Load stats
                loadStats();
            } catch (error) {
                document.getElementById('recentTable').innerHTML = `<tr><td colspan="6" class="error">${error.message}</td></tr>`;
            }
        }

        // Load statistics
        async function loadStats() {
            try {
                const response = await fetch(`${API_URL}/stats`, {
                    headers: {
                        'Authorization': `Bearer ${getToken()}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to load stats');
                }

                const stats = await response.json();
                document.getElementById('totalReceipts').textContent = stats.total_receipts || '0';
                document.getElementById('todayReceipts').textContent = stats.today_receipts || '0';
                document.getElementById('weekReceipts').textContent = stats.week_receipts || '0';
            } catch (error) {
                console.log('Stats error:', error.message);
            }
        }

        // Search and display
        async function searchAndDisplay(orderId) {
            document.getElementById('orderIdInput').value = orderId;
            searchReceipt();
        }

        // Logout
        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/login.html';
        }

        // Load on page load
        window.addEventListener('load', () => {
            if (!getToken()) {
                window.location.href = '/login.html';
                return;
            }
            loadRecentReceipts();
            loadProducts();
        });

        // Enter key to search
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && document.getElementById('orderIdInput') === document.activeElement) {
                searchReceipt();
            }
        });
    </script>
</body>
</html>
