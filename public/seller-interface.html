<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmSecure - Seller Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f6fa;
            color: #2c3e50;
        }
        .container {
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 280px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
        }
        .sidebar-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        .user-name {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 5px;
        }
        .user-role {
            font-size: 12px;
            opacity: 0.9;
        }
        .nav-menu {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .nav-item {
            padding: 12px 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.1);
        }
        .nav-item:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .nav-item.active {
            background: rgba(255, 255, 255, 0.3);
            border-left: 3px solid white;
        }
        .logout-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 12px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
            width: 100%;
        }
        .logout-btn:hover {
            background: #c0392b;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            background: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            border-bottom: 1px solid #ecf0f1;
        }
        .header-title {
            font-size: 24px;
            font-weight: 600;
            color: #2c3e50;
        }
        .language-toggle {
            display: flex;
            gap: 8px;
        }
        .lang-btn {
            padding: 8px 14px;
            border: 1px solid #bdc3c7;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .lang-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        .lang-btn:hover {
            border-color: #667eea;
        }
        .content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
        }
        .search-section {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        .search-input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .product-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            cursor: pointer;
            transition: all 0.3s;
        }
        .product-card:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }
        .product-name {
            font-weight: 600;
            margin-bottom: 8px;
            color: #2c3e50;
        }
        .product-info {
            font-size: 12px;
            color: #7f8c8d;
            margin-bottom: 8px;
        }
        .product-price {
            font-weight: 600;
            color: #667eea;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .add-btn {
            width: 100%;
            padding: 8px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.3s;
        }
        .add-btn:hover {
            background: #764ba2;
        }
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 15px;
            border: 1px solid #f5c6cb;
        }
        .current-order {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            height: fit-content;
        }
        .order-title {
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 16px;
            color: #2c3e50;
        }
        .order-items {
            flex: 1;
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 15px;
        }
        .order-item {
            padding: 10px;
            background: #f8f9fa;
            border-radius: 4px;
            margin-bottom: 8px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-name {
            flex: 1;
        }
        .item-qty {
            background: white;
            padding: 4px 8px;
            border-radius: 3px;
            margin: 0 8px;
            font-weight: 600;
        }
        .qty-control {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .qty-btn {
            background: #667eea;
            color: white;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
        .qty-btn:hover {
            background: #764ba2;
        }
        .remove-btn {
            background: #e74c3c;
            color: white;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 10px;
        }
        .order-summary {
            border-top: 1px solid #ecf0f1;
            padding-top: 10px;
            margin-bottom: 15px;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 8px;
        }
        .summary-row.total {
            font-weight: 600;
            font-size: 15px;
            color: #667eea;
            border-top: 1px solid #ecf0f1;
            padding-top: 8px;
        }
        .transfer-btn {
            width: 100%;
            padding: 12px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }
        .transfer-btn:hover {
            background: #229954;
        }
        .transfer-btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }
        .no-items {
            text-align: center;
            color: #7f8c8d;
            padding: 20px 10px;
            font-size: 13px;
        }

        @media (max-width: 1024px) {
            .content {
                grid-template-columns: 1fr;
            }
            .products-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 70px;
                padding: 10px;
            }
            .sidebar-header,
            .nav-item span,
            .user-role {
                display: none;
            }
            .nav-item {
                padding: 12px;
                text-align: center;
            }
            .products-grid {
                grid-template-columns: 1fr;
            }
            .header-title {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="user-name" id="userName">seller1</div>
                <div class="user-role" id="userRole">Seller Interface</div>
            </div>
            <nav class="nav-menu">
                <div class="nav-item active" onclick="showTab('sales')" id="navSales">Sales</div>
                <div class="nav-item" onclick="showTab('dashboard')" id="navDashboard">Dashboard</div>
                <div class="nav-item" onclick="showTab('reports')" id="navReports">Reports</div>
            </nav>
            <button class="logout-btn" onclick="logout()" id="logoutBtn">Logout</button>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <div class="header">
                <div class="header-title" id="headerTitle">PharmSecure Seller Interface</div>
                <div class="language-toggle">
                    <button class="lang-btn active" onclick="setLanguage('en')" data-lang="en">EN</button>
                    <button class="lang-btn" onclick="setLanguage('fr')" data-lang="fr">FR</button>
                </div>
            </div>

            <!-- Content -->
            <div class="content">
                <!-- Sales Tab -->
                <div id="sales-tab">
                    <div class="search-section">
                        <input 
                            type="text" 
                            class="search-input" 
                            id="searchInput" 
                            placeholder="Search products by name..."
                            oninput="filterProducts()"
                        >
                        <div id="errorMessage"></div>
                        <div class="products-grid" id="productsGrid">
                            <div class="no-items" id="noProductsMsg">Loading products...</div>
                        </div>
                    </div>
                </div>

                <!-- Dashboard Tab -->
                <div id="dashboard-tab" style="display: none;">
                    <div style="background: white; padding: 30px; border-radius: 8px; text-align: center;">
                        <p id="dashboardMsg">Dashboard content coming soon...</p>
                    </div>
                </div>

                <!-- Reports Tab -->
                <div id="reports-tab" style="display: none;">
                    <div style="background: white; padding: 30px; border-radius: 8px; text-align: center;">
                        <p id="reportsMsg">Reports content coming soon...</p>
                    </div>
                </div>

                <!-- Current Order -->
                <div class="current-order">
                    <div class="order-title" id="orderTitle">Current Order</div>
                    <div class="order-items" id="orderItems">
                        <div class="no-items" id="noItemsMsg">No items added</div>
                    </div>
                    <div class="order-summary">
                        <div class="summary-row">
                            <span id="subtotalLabel">Subtotal:</span>
                            <span id="subtotal">GHS 0.00</span>
                        </div>
                        <div class="summary-row total">
                            <span id="totalLabel">Total:</span>
                            <span id="total">GHS 0.00</span>
                        </div>
                    </div>
                    <button class="transfer-btn" onclick="transferToCashier()" id="transferBtn" disabled>Transfer to Cashier</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== TRANSLATIONS ====================
        const translations = {
            en: {
                headerTitle: "PharmSecure Seller Interface",
                navSales: "Sales",
                navDashboard: "Dashboard",
                navReports: "Reports",
                userRole: "Seller Interface",
                searchPlaceholder: "Search products by name...",
                noProducts: "No products available",
                loadingProducts: "Loading products...",
                addBtn: "Add to Order",
                orderTitle: "Current Order",
                noItems: "No items added",
                subtotalLabel: "Subtotal:",
                totalLabel: "Total:",
                transferBtn: "Transfer to Cashier",
                dashboardMsg: "Dashboard content coming soon...",
                reportsMsg: "Reports content coming soon...",
                logoutBtn: "Logout",
                errorFailed: "Failed to load products. Check console.",
            },
            fr: {
                headerTitle: "Interface Vendeur PharmSecure",
                navSales: "Ventes",
                navDashboard: "Tableau de Bord",
                navReports: "Rapports",
                userRole: "Interface Vendeur",
                searchPlaceholder: "Rechercher les produits par nom...",
                noProducts: "Aucun produit disponible",
                loadingProducts: "Chargement des produits...",
                addBtn: "Ajouter à la Commande",
                orderTitle: "Commande Actuelle",
                noItems: "Aucun article ajouté",
                subtotalLabel: "Sous-total:",
                totalLabel: "Total:",
                transferBtn: "Transférer au Caissier",
                dashboardMsg: "Le contenu du tableau de bord arrive bientôt...",
                reportsMsg: "Le contenu des rapports arrive bientôt...",
                logoutBtn: "Déconnexion",
                errorFailed: "Échec du chargement des produits. Vérifiez la console.",
            }
        };

        let currentLanguage = localStorage.getItem('language') || 'en';
        let cart = [];
        let products = [];

        // ==================== LANGUAGE FUNCTIONS ====================
        function setLanguage(lang) {
            currentLanguage = lang;
            localStorage.setItem('language', lang);
            updateUIText();
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
        }

        function updateUIText() {
            const t = translations[currentLanguage];
            document.getElementById('headerTitle').textContent = t.headerTitle;
            document.getElementById('navSales').textContent = t.navSales;
            document.getElementById('navDashboard').textContent = t.navDashboard;
            document.getElementById('navReports').textContent = t.navReports;
            document.getElementById('userRole').textContent = t.userRole;
            document.getElementById('searchInput').placeholder = t.searchPlaceholder;
            document.getElementById('orderTitle').textContent = t.orderTitle;
            document.getElementById('subtotalLabel').textContent = t.subtotalLabel;
            document.getElementById('totalLabel').textContent = t.totalLabel;
            document.getElementById('transferBtn').textContent = t.transferBtn;
            document.getElementById('logoutBtn').textContent = t.logoutBtn;
            document.getElementById('dashboardMsg').textContent = t.dashboardMsg;
            document.getElementById('reportsMsg').textContent = t.reportsMsg;
            updateProductDisplay();
            updateOrderDisplay();
        }

        // ==================== INITIALIZATION ====================
        window.addEventListener('DOMContentLoaded', () => {
            // Check authentication
            const token = localStorage.getItem('token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            
            if (!token || user.role !== 'seller') {
                window.location.href = '/login.html';
                return;
            }

            document.getElementById('userName').textContent = user.username || 'Seller';
            
            updateUIText();
            loadProducts();
            
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === currentLanguage);
            });
        });

        // ==================== PRODUCT FUNCTIONS ====================
        function loadProducts() {
            const t = translations[currentLanguage];
            document.getElementById('productsGrid').innerHTML = `<div class="no-items">${t.loadingProducts}</div>`;
            
            const token = localStorage.getItem('token');
            fetch('https://pharmsecure-api.onrender.com/api/products', {
                headers: { 'Authorization': `Bearer ${token}` }
            })
            .then(r => r.json())
            .then(res => {
                if (res.success && Array.isArray(res.data)) {
                    products = res.data;
                    updateProductDisplay();
                } else {
                    showError(t.errorFailed);
                }
            })
            .catch(e => {
                console.error('Error loading products:', e);
                showError(t.errorFailed);
            });
        }

        function updateProductDisplay() {
            const t = translations[currentLanguage];
            const grid = document.getElementById('productsGrid');
            
            if (!products || products.length === 0) {
                grid.innerHTML = `<div class="no-items">${t.noProducts}</div>`;
                return;
            }

            grid.innerHTML = products.map(p => `
                <div class="product-card">
                    <div class="product-name">${p.name}</div>
                    <div class="product-info">${p.sku}</div>
                    <div class="product-price">GHS ${parseFloat(p.price).toFixed(2)}</div>
                    <button class="add-btn" onclick="addToCart({id: '${p.id}', name: '${p.name}', price: ${p.price}, quantity: ${p.quantity}})">${t.addBtn}</button>
                </div>
            `).join('');
        }

        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(query));
            
            const t = translations[currentLanguage];
            const grid = document.getElementById('productsGrid');
            
            if (filtered.length === 0) {
                grid.innerHTML = `<div class="no-items">${t.noProducts}</div>`;
                return;
            }

            grid.innerHTML = filtered.map(p => `
                <div class="product-card">
                    <div class="product-name">${p.name}</div>
                    <div class="product-info">${p.sku}</div>
                    <div class="product-price">GHS ${parseFloat(p.price).toFixed(2)}</div>
                    <button class="add-btn" onclick="addToCart({id: '${p.id}', name: '${p.name}', price: ${p.price}, quantity: ${p.quantity}})">${t.addBtn}</button>
                </div>
            `).join('');
        }

        // ==================== CART FUNCTIONS ====================
        function addToCart(product) {
            let item = cart.find(c => c.id === product.id);
            if (item) {
                item.cartQuantity = (item.cartQuantity || 1) + 1;
            } else {
                cart.push({...product, cartQuantity: 1});
            }
            updateOrderDisplay();
        }

        function updateOrderDisplay() {
            const t = translations[currentLanguage];
            const orderItems = document.getElementById('orderItems');
            
            if (cart.length === 0) {
                orderItems.innerHTML = `<div class="no-items">${t.noItems}</div>`;
                document.getElementById('subtotal').textContent = 'GHS 0.00';
                document.getElementById('total').textContent = 'GHS 0.00';
                document.getElementById('transferBtn').disabled = true;
                return;
            }

            let subtotal = 0;
            orderItems.innerHTML = cart.map(item => {
                const itemTotal = item.price * item.cartQuantity;
                subtotal += itemTotal;
                return `
                    <div class="order-item">
                        <div class="item-name">${item.name}</div>
                        <div class="qty-control">
                            <button class="qty-btn" onclick="updateQty('${item.id}', -1)">−</button>
                            <div class="item-qty">${item.cartQuantity}</div>
                            <button class="qty-btn" onclick="updateQty('${item.id}', 1)">+</button>
                            <button class="remove-btn" onclick="removeFromCart('${item.id}')">✕</button>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('subtotal').textContent = `GHS ${subtotal.toFixed(2)}`;
            document.getElementById('total').textContent = `GHS ${subtotal.toFixed(2)}`;
            document.getElementById('transferBtn').disabled = false;
        }

        function updateQty(productId, change) {
            const item = cart.find(c => c.id === productId);
            if (item) {
                item.cartQuantity = Math.max(1, (item.cartQuantity || 1) + change);
                updateOrderDisplay();
            }
        }

        function removeFromCart(productId) {
            cart = cart.filter(c => c.id !== productId);
            updateOrderDisplay();
        }

        // ==================== ORDER FUNCTIONS ====================
        function transferToCashier() {
            if (cart.length === 0) return;

            const token = localStorage.getItem('token');
            const orderData = {
                items: cart.map(c => ({product_id: c.id, quantity: c.cartQuantity, unit_price: c.price})),
                total: cart.reduce((sum, c) => sum + (c.price * c.cartQuantity), 0),
                status: 'READY_FOR_PAYMENT'
            };

            fetch('https://pharmsecure-api.onrender.com/api/pending-orders', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(orderData)
            })
            .then(r => r.json())
            .then(res => {
                if (res.success) {
                    alert(currentLanguage === 'fr' ? 'Commande transférée au caissier!' : 'Order transferred to cashier!');
                    cart = [];
                    updateOrderDisplay();
                } else {
                    alert(currentLanguage === 'fr' ? 'Erreur: ' + res.message : 'Error: ' + res.message);
                }
            })
            .catch(e => console.error('Error:', e));
        }

        // ==================== UI FUNCTIONS ====================
        function showTab(tabName) {
            document.querySelectorAll('[id$="-tab"]').forEach(tab => tab.style.display = 'none');
            document.getElementById(tabName + '-tab').style.display = 'block';
            
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            event.target.classList.add('active');
        }

        function showError(msg) {
            document.getElementById('errorMessage').innerHTML = `<div class="error-message">${msg}</div>`;
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/login.html';
        }
    </script>
</body>
</html>
